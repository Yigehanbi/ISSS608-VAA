format: 
  html:
    toc: true
    include-after-body:
      - text: |
          <style>
            .sparkle {
              position: absolute;
              pointer-events: none;
              background-image: url('/Images/troll.png');
              background-size: contain;
              background-repeat:no-repeat;
              border-radius: 50%;
              transform: translate(-50%, -50%);
              opacity: 0.9;
              animation: sparkle-fade 0.45s linear forwards;
              z-index: 9999;
            }
          
            @keyframes sparkle-fade {
              0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.9;
              }
              100% {
                transform: translate(-50%, -50%) scale(0.6);
                opacity: 0;
              }
            }
          </style>
          
          <script>
          (() => {
                if ("ontouchstart" in window) return;
                if (window.matchMedia("(prefers-reduced-motion)").matches) return;
              
                let lastTime = 0;
              
                function attachSparkles() {
                  document.addEventListener("mousemove", (e) => {
                    const now = performance.now();
                    if (now - lastTime < 18) return;
                    lastTime = now;
              
                    const sparkle = document.createElement("div");
                    sparkle.className = "sparkle";
                    sparkle.style.left = e.pageX + "px";
                    sparkle.style.top = e.pageY + "px";
                    
                    const size = Math.random() * 48 + 36;
                    sparkle.style.width = size + "px";
                    sparkle.style.height = size + "px";
              
                    document.body.appendChild(sparkle);
              
                    setTimeout(() => sparkle.remove(), 300);
                  });
                }
              
                window.addEventListener("DOMContentLoaded", attachSparkles);
                document.addEventListener("quarto:page-changed", attachSparkles);
              })();

          
          </script>
          
      
          
          

